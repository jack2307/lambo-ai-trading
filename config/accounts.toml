# The broker accounts a paper book can be mirrored into.
#
# THIS FILE IS WHERE YOU ADD AN ACCOUNT. Nothing else needs editing: the
# launcher reads it to know what to start, and the desk reads it to know what
# to list, so an account added here appears in both.
#
# One entry is one MetaTrader terminal logged into one login. That pairing is
# not a convention, it is what MetaTrader allows: a terminal holds one account
# at a time, so two accounts means two INSTALLATIONS, each with its own
# directory. `MetaTrader5` in Python reaches a specific one by `path=`, and it
# reaches them independently - measured 2026-09-16, with the demo and the live
# terminal running side by side.
#
# So to add a second account:
#
#   1. Install (or copy) a terminal into its own directory, e.g. C:\MT5-demo2.
#      A copy made from `C:\Program Files\MetaTrader 5` starts with an EMPTY
#      server list, because a normal install keeps its servers in AppData and
#      not in Program Files; it then cannot resolve the broker's server name,
#      the login silently does nothing and NOTHING IS LOGGED. Copy
#      `%APPDATA%\MetaQuotes\Terminal\<hash>\config\servers.dat` into the new
#      terminal's `config\` and it will log in. This cost an afternoon once.
#   2. Log that terminal into the account, by hand or with a start config.
#   3. Add an `[[account]]` block here.
#   4. `powershell -File py\live\start_executors.ps1 -Account <id>`
#
# No password belongs in this file. The terminal holds its own credentials;
# the executor only ever attaches to a terminal that is ALREADY logged in, and
# refuses outright if the account it finds is not the `login` named here.

[[account]]
# Short, stable, and what you type at the launcher. It is also the name the
# desk shows, so it is worth reading well.
id = "vantage-demo"
label = "Vantage demo - cent mirror"

# The account the terminal must already be logged into. Checked against
# `account_info().login` before any order is sent: a terminal that is not the
# one you named is not the one you meant, and the executor exits rather than
# trade the wrong account.
login = 26108386
server = "VantageMarkets-Demo"
terminal = 'C:\MT5-demo\terminal64.exe'

# Terminal volume = the book's lots x this.
#
# 1.0 is right for a CENT paper book mirrored into a STANDARD account, and that
# is not a coincidence to be re-derived per account. Every pair's contract is
# exactly 100x larger on the standard symbol (MEASURED 2026-09-16: XAUUSD
# 1 -> 100, BTCUSD 0.01 -> 1, EURUSD 1000 -> 100000) and this account's 10,000
# USD is exactly 100x the book's 10,000 USC. Both sides of the ratio scale
# together, so the same lot number is the same fraction of equity on either.
# Change it only to trade this account SMALLER or LARGER than the book on
# purpose.
lot_scale = 1.0

# Reconcile and record, send nothing. The account still appears on the desk and
# still reports its balance; what it will not do is place an order.
#
# Leave a new account here until you have watched it agree with the book for a
# while. It costs nothing and it is the only way to find out that a book's
# lots are wrong BEFORE the broker finds out for you.
dry_run = true

# False hides the account from the launcher's `-All` without deleting what you
# worked out to set it up.
enabled = true

# Which books this account mirrors. This IS the strategy selection: a book not
# named here is paper only, on this account.
#
# Each book gets its own process and its own magic number, so one account can
# carry several books without their results running together - the executor
# matches positions and history by magic, never by symbol alone.
runs = ["xau-ema", "xau-macd-asia"]

# A second account looks like this. Note the separate terminal directory - two
# entries pointing at one terminal would be two executors fighting over one
# account, and the launcher refuses that.
#
# [[account]]
# id = "demo-two"
# label = "Second demo - half size"
# login = 12345678
# server = "VantageMarkets-Demo"
# terminal = 'C:\MT5-demo2\terminal64.exe'
# lot_scale = 0.5
# dry_run = true
# enabled = false
# runs = ["xau-ema"]
#
# The example is a second DEMO on purpose. A real login sitting here would be
# one uncommented line away from pointing the desk at real money, and an
# example is exactly the thing people uncomment without reading.
#
# The executor refuses a real-money account outright, whatever this file says.
# That lock is in the code and not in configuration on purpose: a live account
# reached by a book that has never been verified against a demo is the one
# mistake here that costs real money.
