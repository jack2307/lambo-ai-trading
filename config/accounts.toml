# The broker accounts a paper book can be mirrored into.
#
# THIS FILE IS WHERE YOU ADD AN ACCOUNT. Nothing else needs editing: the
# launcher reads it to know what to start, and the desk reads it to know what
# to list, so an account added here appears in both.
#
# One entry is one MetaTrader terminal logged into one login. That pairing is
# not a convention, it is what MetaTrader allows: a terminal holds one account
# at a time, so two accounts means two INSTALLATIONS, each with its own
# directory. `MetaTrader5` in Python reaches a specific one by `path=`, and it
# reaches them independently - measured 2026-09-16, with the demo and the live
# terminal running side by side.
#
# So to add a second account:
#
#   1. Install (or copy) a terminal into its own directory, e.g. C:\MT5-demo2.
#      A copy made from `C:\Program Files\MetaTrader 5` starts with an EMPTY
#      server list, because a normal install keeps its servers in AppData and
#      not in Program Files; it then cannot resolve the broker's server name,
#      the login silently does nothing and NOTHING IS LOGGED. Copy
#      `%APPDATA%\MetaQuotes\Terminal\<hash>\config\servers.dat` into the new
#      terminal's `config\` and it will log in. This cost an afternoon once.
#   2. Log that terminal into the account, by hand or with a start config.
#   3. TURN AUTOTRADING ON, AND DO IT AFTER STEP 2, NOT BEFORE.
#
#      MetaTrader switches automated trading OFF whenever the account
#      changes - deliberately, and it says so in its own log:
#
#        Experts  automated trading is disabled because the account
#                 has been changed
#
#      So a start config carrying `[Experts] AllowLiveTrading=1` sets it at
#      launch and then LOSES it the moment someone logs in. Measured
#      2026-09-17 on the cent account: config applied at 13:59, account
#      changed at 14:00, AutoTrading off ever since, and `terminal_info()
#      .trade_allowed` was the only place saying so.
#
#      With it off, every order comes back retcode 10027 "AutoTrading
#      disabled by client" and the executor looks exactly like a strategy
#      that never fires. That cost 36 refused orders on the demo.
#
#      Click Algo Trading in the toolbar, or restart the terminal from its
#      shortcut now that it remembers the account - with no account change
#      to follow, the start config's setting survives.
#   4. Add an `[[account]]` block here.
#   5. `powershell -File py\live\start_executors.ps1 -Account <id>`
#
# Each account keeps its OWN record of every book it mirrors, under
# data/live/<id>/<book>/ - the fills, the slippage, the account snapshot, the
# executor's own output, and a STOP file that pauses that book on that account
# alone. This matters because one book may run on several accounts at once,
# which is the comparison most worth making: the same rule, a demo and a small
# real account, and the difference is the fill. A shared file per book would
# have let the second account overwrite the first's record.
#
# data/paper/<book>/STOP still stops a book on EVERY account - reach for it
# when the book itself is wrong rather than one account's execution.
#
# No password belongs in this file. The terminal holds its own credentials;
# the executor only ever attaches to a terminal that is ALREADY logged in, and
# refuses outright if the account it finds is not the `login` named here.

[[account]]
# Short, stable, and what you type at the launcher. It is also the name the
# desk shows, so it is worth reading well.
id = "vantage-demo"
label = "Vantage demo - cent mirror"

# The account the terminal must already be logged into. Checked against
# `account_info().login` before any order is sent: a terminal that is not the
# one you named is not the one you meant, and the executor exits rather than
# trade the wrong account.
login = 26108386
server = "VantageMarkets-Demo"
terminal = 'C:\MT5-demo\terminal64.exe'

# Terminal volume = the book's lots x this.
#
# 1.0 is right for a CENT paper book mirrored into a STANDARD account, and that
# is not a coincidence to be re-derived per account. Every pair's contract is
# exactly 100x larger on the standard symbol (MEASURED 2026-09-16: XAUUSD
# 1 -> 100, BTCUSD 0.01 -> 1, EURUSD 1000 -> 100000) and this account's 10,000
# USD is exactly 100x the book's 10,000 USC. Both sides of the ratio scale
# together, so the same lot number is the same fraction of equity on either.
# Change it only to trade this account SMALLER or LARGER than the book on
# purpose.
lot_scale = 1.0

# Reconcile and record, send nothing. The account still appears on the desk and
# still reports its balance; what it will not do is place an order.
#
# Turned off 2026-09-16 on the owner's explicit instruction, after a day of dry
# runs on this account in which every book reconciled, the sizes came out right
# and nothing was refused. This is a DEMO account.
#
# It said "and the executor refuses a real-money one outright, whatever this
# file says" until 2026-09-17, which stopped being true the day the owner
# funded a real account: the wall became a permission, and a real account now
# runs when `real_money = true` here and `-AllowReal` is typed. See the block
# below. Corrected rather than deleted because it is the sentence the day's
# reasoning rested on.
#
# It still takes `-Live` on the command line for an order to leave the machine:
# the file grants permission, the command line spends it.
dry_run = false

# False means this account does not run. Nothing is deleted: what you worked
# out to set it up stays here, and the launcher skips it.
#
# Off since 2026-09-17, on the owner's word: the demo had done its job and a
# real cent account took over. Everything that made it work is still written
# down here, and every fill it ever took is still in data/live/vantage-demo/.
#
# There is a second reason to leave it off, and it is the stronger one. This
# desk now runs on ONE machine, and the desktop it moved from still has a
# terminal logged into this same demo. Two machines mirroring one account send
# every order twice, and the launcher's mutex is system-wide, not world-wide -
# it cannot see the other machine at all.
#
# THIS LINE USED TO SAY "an account that is off cannot be started by accident
# on either", AND THAT WAS FALSE FROM THE DAY IT WAS WRITTEN UNTIL 2026-09-17.
# `-Account <id>` reaches accounts.py as `--id`, which answers for a disabled
# account by design, and start_executors.ps1 never read this field - so
# `start_executors.ps1 -Account vantage-demo -Live` started this account's
# mirrors, on either machine, exactly as though the line above were absent.
# The launcher now checks it. The wrong sentence is recorded rather than
# quietly replaced because it was believed, and by the person who wrote it.
#
# What it still cannot do is see the other machine. `enabled = false` is one
# file on one disk; the desktop has its own copy of this repository and its own
# copy of this file. Turning an account off here stops it HERE. The only thing
# that stops it there is that file being off there too, or the terminal not
# being logged in.
enabled = false

# Which books this account mirrors. This IS the strategy selection: a book not
# named here is paper only, on this account.
#
# Each book gets its own process and its own magic number, so one account can
# carry several books without their results running together - the executor
# matches positions and history by magic, never by symbol alone. Checked for
# collisions across these eight on 2026-09-16: none.
#
# THE COIN CONTROLS ARE NOT HERE, AND THE CAMPAIGN STILL HAS THEM.
#
# They were listed here until 2026-09-17. The owner's objection was not that
# the coin measures nothing - it was that a coin taking real positions is
# money spent to learn something a paper book already knows. He is right, and
# the text this replaces had the two things welded together.
#
# Measuring and mirroring are separate. Every `-coin` book still runs, still
# takes its seeded flip, still records its own trades. What it no longer does
# is spend margin on this account. The comparison the campaign exists to make
# - does the model's direction beat a coin's, over the same bars, under the
# same guards - is a PAPER comparison, and it is untouched.
#
# What IS lost, stated rather than glossed: the coin no longer pays a real
# spread or takes real slippage, so "the model beat the coin" can be checked
# in the book but no longer at the broker. That would matter if execution cost
# turned out to differ by direction. It has not in the record so far, and it
# is a smaller thing than paying for random trades to find out.
#
# Removed while all three were FLAT on this account - the condition the note
# below insists on, checked before the edit and not after. Realised up to that
# point: ds-coin -116.35, opus-coin 0.00, sol-coin +77.04.
#
# What this account CANNOT reproduce is that each paper book has its own 10,000
# USC while all five share this one account. Each still sizes as though it
# owned the whole thing, so their risk adds up here and does not there: five
# books at the desk's 300% notional cap is 15x this account's equity in
# notional at once, about 5% of it at risk. Safe at 1:500 - margin level near
# 3000% against a 30% stop-out - but safe by arithmetic, which is why the
# executor now also refuses any open that would take the ACCOUNT below a 500%
# margin level.
runs = [
    "xau-ema",
    "xau-macd-asia",
    "ai-xau-ds-ctx",
    "ai-xau-opus-ctx",
    "ai-xau-terra-ctx",
]

# sol out, terra in, 2026-09-17. See the same swap on the cent account below
# for the whole of it - this account is disabled and mirrors nothing today, so
# the entry that costs money is that one and the reasoning is written there.

# Opus came out on 2026-09-16 and went back in the same day, both on the
# owner's word. Its coin went with it each time, under a rule that no longer
# applies: while coins were mirrored, a coin here without its model would have
# put random-direction positions on the account with nothing to compare them
# against. No coin is mirrored now, so that pairing rule is spent - a model
# enters and leaves this list on its own, and its coin keeps running on paper
# either way.
#
# Being listed here does nothing on its own. The mirror can only copy decisions
# that exist, so a book whose `ai_trader` is not running is simply flat here.
# Opus's trader was stopped to save quota and has to be started again before
# any of this reaches the account.
#
# Removing a book from `runs` only stops the mirror from OPENING. Check it is
# flat on the account first: the launcher stops every executor, so a book
# dropped while it holds a position leaves that position behind with nobody
# reconciling it. Both Opus books were flat when this was done.


# ---------------------------------------------------------------------------
# REAL MONEY. Read this block before changing anything in it.
# ---------------------------------------------------------------------------
[[account]]
id = "vantage-cent"
label = "Vantage cent - REAL MONEY"

# Standard STP Cent, on the same server the desk already reads prices from.
# A cent account quotes the `.sc` book the paper desk has used since the
# beginning - XAUUSD.sc contract 1, BTCUSD.sc 0.01, EURUSD.sc 1000, which is
# exactly what config/default.toml already says. So this account needs no unit
# conversion at all. That is the opposite of the demo below it, where a
# standard account meant every contract was 100x the book's and the mapping
# had to be worked out; here the paper books ARE cent books.
login = 33705331
server = "VantageMarkets-Live 21"

# Its own terminal, and deliberately NOT the one in Program Files.
#
# A terminal holds one account at a time, and the Program Files install is
# what the pollers read prices from. Pointing it at this account would work -
# same broker, same symbols - but it would put the desk's whole price feed on
# the same login that is carrying money, so a re-login here would blind the
# desk. Separate installs keep the two failures separate.
terminal = 'C:\MT5-cent\terminal64.exe'

# This account lists XAUUSD.sc, not XAUUSD. The demo below lists the opposite
# and sets no suffix. It belongs to the account and not to the market because
# `xauusd` is the same gold on both - only the name differs.
symbol_suffix = ".sc"

# Each paper book has its own 10,000 USC. Five of them share this one account,
# and each still sizes as though it owned the whole thing - so at 1.0 the five
# together would risk five times what any one of them was designed to risk.
# The account is funded with 10,000 USC (USD 100), so the fifth is the honest
# scale and the owner chose it on 2026-09-17.
#
# This is the number that decides how much money an idea costs to be wrong
# about. Nothing else in this file is closer to the money.
lot_scale = 0.2

# THE KEY THAT LIVES IN A FILE. Without it the executor exits 3 on a REAL
# account however the command line reads. The executor makes three checks in
# all: this one, `--allow-real` on the command line, and `--login` matching the
# account the terminal is actually holding.
#
# THEY ARE THREE CHECKS AND NOT THREE INDEPENDENT DECISIONS, and this file said
# otherwise until 2026-09-17. Started the documented way, through
# `start_executors.ps1`, the launcher reads THIS line and adds `--allow-real`
# itself, and `--login` comes from the `login =` field a few lines above - so
# one edit to this block plus one typed `-AllowReal` spends the whole
# permission, and the third check is asked a question this same block supplied
# the answer to. Only an executor started by hand puts three separate hands
# on it.
#
# What the third check IS worth, on every path: it is the only one of the three
# that asks the TERMINAL rather than a file. A registry that grants
# `vantage-cent` cannot reach an account the terminal is not holding, so a
# terminal logged into the wrong account still stops everything, whatever this
# file says and whatever was typed. That is a real guarantee, and it is the one
# to say out loud instead of a count.
#
# The split between a file and a command line is still worth what it was worth:
# a config was edited once by someone who has gone to bed, a command line is
# typed by someone who is awake.
real_money = true

# Off since 2026-09-17, on the owner's explicit word.
#
# The demo spent a full day recording before it was turned off, and that day
# is what caught two contract sizes being wrong by a factor of a thousand. I
# put the same day to the owner here and he asked to go straight to it; that
# is his call to make and it is written down as his.
#
# What stood in for the day: the mirrors ran dry against this account first
# and reported the symbol, the contract size and the magic they would use, and
# the volume arithmetic was checked by hand. At lot_scale 0.2 a book asking
# 0.06 lots sends 0.01 - the broker's minimum, and a 17% trim - so on this
# account the 0.01 floor is doing part of the sizing. A book wanting less than
# 0.05 lots is pushed UP to 0.01, which the executor marks `clipped` rather
# than absorbing quietly.
#
# The file grants; the command line still has to spend it. `-Live` and
# `-AllowReal` are both required, and neither is in this file.
dry_run = false

enabled = true

# The same five books the demo mirrors. The coin controls are not here and are
# not coming here - see the demo's note above.
#
# ---------------------------------------------------------------------------
# sol OUT, terra IN. 2026-09-17, on the owner's explicit decision, AGAINST the
# advice he was given. Both halves of that sentence are here on purpose.
# ---------------------------------------------------------------------------
#
# WHY SOL CAME OUT. Its model became unreachable on the machine the desk runs
# on. The book was STOPPED rather than repointed at a different model, for the
# reason this file already gives for account ids and directories: an id has to
# keep meaning one thing. `ai-xau-sol-ctx` is the record of what gpt-5.6-sol
# decided; a different model writing into it would leave every number intact
# and none of them comparable. Its 99 decisions stay exactly as they are.
#
# It was FLAT when this edit was made - the paper book's position was None and
# its last line was a stand-aside at 05:00Z - which is the condition the note
# further down insists on. Dropping a book that holds a position leaves that
# position on the account with nobody reconciling it.
#
# WHY TERRA GOING IN WAS ADVISED AGAINST, and what the advice was:
#
#   1. It starts with ZERO decisions. Nothing anyone has read. Every other
#      book on this list was mirrored after someone had looked at its paper
#      record.
#   2. Nothing transfers from sol. By the vendor's own ordering terra ranks
#      BELOW sol - priority 7 against 4, from the account's own
#      models_cache.json - so it is a substitution and not an upgrade, and
#      sol's 99 decisions say nothing about how this one will behave.
#   3. The cost of waiting was one line in this file. The cost of not waiting
#      is real orders on a hundred-dollar account already carrying five books
#      whose risk adds up in one place, which is the arithmetic the
#      lot_scale note above exists for.
#
# The owner was given that recommendation, with support for it, and chose to
# mirror terra anyway. It is his account and his call, and it is recorded as
# his rather than smoothed into a tidy-up.
#
# WHAT THIS MEANS FOR ANYONE READING TERRA'S CURVE LATER, which is the only
# reason this paragraph is as long as it is: it started COLD. Not merely new -
# cold, with no paper history behind it and none inherited from the book it
# replaced. Its magic number is its own (4,609,806, against sol's 208,709,589
# - checked for collision across all five on 2026-09-17, none), so it cannot
# adopt a single one of sol's positions at the broker either. Whatever that
# curve shows after a month is the first thing anyone has ever known about
# this model on this task. Do not read it as continuing anything.
runs = [
    "xau-ema",
    "xau-macd-asia",
    "ai-xau-ds-ctx",
    "ai-xau-opus-ctx",
    "ai-xau-terra-ctx",
]

# The directory data/live/vantage-cent/ is stamped with this login the first
# time an executor runs, and refuses to hold any other afterwards. That is the
# guard on the owner's standing requirement that the record reads as one
# unbroken history: deleting it was never the danger - `data/` is gitignored
# and no deploy script touches it - but writing two accounts into one file
# would leave every number intact and none of them meaningful.

# A second account looks like this. Note the separate terminal directory - two
# entries pointing at one terminal would be two executors fighting over one
# account, and the launcher refuses that.
#
# [[account]]
# id = "demo-two"
# label = "Second demo - half size"
# login = 12345678
# server = "VantageMarkets-Demo"
# terminal = 'C:\MT5-demo2\terminal64.exe'
# lot_scale = 0.5
# dry_run = true
# enabled = false
# runs = ["xau-ema"]
#
# The example is a second DEMO on purpose. A real login sitting here would be
# one uncommented line away from pointing the desk at real money, and an
# example is exactly the thing people uncomment without reading.
#
# This paragraph used to end "the executor refuses a real-money account
# outright, whatever this file says", and that has been untrue since
# 2026-09-17. A real account now runs on `real_money = true` here plus
# `-AllowReal` typed at the launcher. An example block that quietly relied on a
# lock which no longer exists is the worst possible place for a stale comment,
# so it is corrected here rather than left to be read as reassurance.
#
# What is still true, and is the reason the example stays a DEMO: a live
# account reached by a book that has never been verified against a demo is the
# one mistake in this file that costs real money. The defence is now a
# permission spent in two places rather than a wall, which means reading before
# uncommenting matters more than it did, not less.
