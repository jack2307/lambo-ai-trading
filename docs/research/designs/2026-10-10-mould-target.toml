# Does ANY parameterisation of an existing registry mechanism reach a gross of
# 8.7 round-trip spreads per exposed session, on BOTH time-split windows?
# Registered: docs/decisions/2026-10-10-mould-target.md (committed alone).
# Rows frozen here. Excluded and why: level-reversion / maxpain-magnet /
# flow-momentum / flow-at-level (needs_options, no timeline in this run),
# external (no signal file), companion-unconfirmed (no --companion=),
# and every volMult parameterisation of volume-thrust / rsi-reversal-vol
# (dead on this feed for EVERY value, by code read - registration section 5;
# 0 cells spent). No filters on any row: the guards arm carries the weekend
# and the calendar.

