# Long-horizon gold holds, >= 5 sessions, swap-free account.
# Registered: docs/decisions/2026-10-06-long-horizon-swapfree.md
# 8 rows, frozen. No filters: the guards arm carries the weekend/calendar,
# the no-guards arm carries nothing, and that contrast is the point.

[[hypothesis]]
label = "qs-h5"
base = "quiet-swing"
filters = []
overrides = { holdSessions = 5 }
why = "the registered 5-session horizon, re-read with no guards so the hold is allowed to cross a weekend"

