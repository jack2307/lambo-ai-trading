[run]
in_sample = "xauduka:5m"
in_sample_to = "2025-04-10"
out_of_sample = "xauusd:5m"
seeds = 200
direction_samples = 1000

[[hypothesis]]
label = "hivol/london"
base = "orb"
filters = ["weekdays", "flat:1630-1815", "hours:0800-1200", "volabs:14:0.075-9"]
overrides = { rangeStart = 200, rangeMinutes = 360, entryUntil = 1200, maxRangeAtr = 100 }
why = "the London-range break, only when ATR14/close is at or above 0.075%"

[[hypothesis]]
label = "lowvol/london"
base = "orb"
filters = ["weekdays", "flat:1630-1815", "hours:0800-1200", "volabs:14:0-0.075"]
overrides = { rangeStart = 200, rangeMinutes = 360, entryUntil = 1200, maxRangeAtr = 100 }
why = "the contrast: the same break below the line must not pass, or volatility was not the condition"

[[hypothesis]]
label = "hivol/orb60"
base = "orb"
filters = ["weekdays", "flat:1630-1815", "hours:0920-1200", "volabs:14:0.075-9"]
overrides = { rangeStart = 820, rangeMinutes = 60, entryUntil = 1200, maxRangeAtr = 100 }
why = "the New York opening-range break under the same condition"

[[hypothesis]]
label = "lowvol/orb60"
base = "orb"
filters = ["weekdays", "flat:1630-1815", "hours:0920-1200", "volabs:14:0-0.075"]
overrides = { rangeStart = 820, rangeMinutes = 60, entryUntil = 1200, maxRangeAtr = 100 }
why = "its contrast"
