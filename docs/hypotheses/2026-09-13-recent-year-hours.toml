[[hypothesis]]
label = "hold/00-02-long"
base = "session-hold"
filters = ["weekdays", "hours:0000-0005"]
overrides = { from = 0, to = 200, side = 1 }
why = "long from 00:00 to 02:00 New York; the null holds random sides from the same bar"

