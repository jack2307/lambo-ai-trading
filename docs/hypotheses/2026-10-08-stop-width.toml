# agent/stop-width - stop size as the axis.  Registered in
# docs/decisions/2026-10-08-stop-width.md; 40 declared cells here, run over two
# windows and two guard arms = 160.  The ONLY axis is riskDailyRanges (f), the
# sizing-stop width in mean New York-day ranges over 20 days.  Every other
# parameter is the closed record's (2026-09-13-close-reopen-drift.toml) byte for
# byte, so f = 1.000 reproduces the published row and is the control.
[run]
in_sample = "xauduka:15m"
in_sample_from = "2018-06-16"
in_sample_to = "2025-04-10"
out_of_sample = "xauusd:15m"
out_of_sample_from = "2025-04-11"
seeds = 100
direction_samples = 1000
fixed = true

[[hypothesis]]
label = "c1815/f4.000"
base = "session-hold"
filters = ["weekdays:MoTuWeTh", "hours:1615-1620"]
overrides = { from = 1615, to = 1815, side = 1, riskDailyRanges = 4.000, rangeDays = 20 }
why = "close/1615-1815 at sizing stop f = 4.000 mean NY-day ranges"

[[hypothesis]]
label = "c1815/f2.000"
base = "session-hold"
filters = ["weekdays:MoTuWeTh", "hours:1615-1620"]
