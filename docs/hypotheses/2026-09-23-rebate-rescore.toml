# The run spec for docs/hypotheses/2026-09-23-rebate-rescore.md.
#
# THIS FILE IS NOT THE REGISTRATION. The registration is the markdown beside
# it, committed before any run, and its falsifier, its multiplicity statement
# and its data section are not adjustable. This is only the batch the runner
# reads: one row per construct that carries a recorded profit factor in
# `ui/src/lib/verdicts.ts`.
#
# WHY THESE ROWS. Twenty-nine verdict rows quote a profit factor. Eight of
# them are indicators quoting their own strategy's number verbatim — `ema` is
# `ema-cross`, `keltner` is `keltner-break` — so they are the same run and are
# not listed twice here. The ninth, `atr`, is not a base method at all: ATR is
# the risk unit, and its recorded 0.950/1.004 came from a volatility CONDITION
# on the opening-range break (docs/hypotheses/2026-09-13-volcond-breakout.md),
# so it is carried as those two gated rows. That leaves twenty-two rows
# covering all twenty-nine constructs, and the decision record says which row
# answers for which construct.
#
# THE FILTERS ARE THE SCREEN'S, NOT A NEW CHOICE. Seventeen of the twenty
# strategies were closed as the all-day rows of
# docs/hypotheses/2026-09-13-recent-year-screen.toml, which gates every entry
# to weekdays and holds the book flat across the 16:30-18:15 New York window.
# Those two filters are repeated here unchanged so a gross column reproduces
# the receipt it is being compared with. The three that were closed on other
# windows - volman-box, tsmom, intraday-momentum - are run on the same primary
# year under the same two filters, because the registration's data section
# names one primary window for every construct.

[run]
# The recent Vantage year, the criterion the owner made primary on 2026-09-13.
in_sample = "xauusd:15m"
in_sample_from = "2025-09-13"
in_sample_to = "2026-09-12"
# Reported beside any candidate and never a gate.
out_of_sample = "xauduka:15m"
out_of_sample_from = "2022-06-16"
out_of_sample_to = "2025-04-10"
seeds = 200
direction_samples = 1000
# The configured spread, not the logger's measured 0.21. Every receipt in
# docs/decisions/ was measured at 0.28 and repricing here would flatter every
# row against the record it is being compared with.
spread = 0.28
# config/accounts.toml, [rebate] share_of_spread.
rebate_share_of_spread = 0.45

[[hypothesis]]
label = "ema-cross"
base = "ema-cross"
filters = ["weekdays", "flat:1630-1815"]
overrides = {}
why = "closed at PF 1.033 on BTC and 0.768 on gold; also the `ema` indicator row"

