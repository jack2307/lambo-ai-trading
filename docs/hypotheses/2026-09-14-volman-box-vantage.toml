# Context batch for 2026-09-14-volman-box: the owner's recent-year criterion on
# the broker's own bars. Reported in the record; decides nothing about the claim.
[run]
in_sample = "xauusd:5m"
in_sample_from = "2025-04-11"
in_sample_to = "2026-09-12"
out_of_sample = "xauduka:5m"
out_of_sample_from = "2018-06-16"
out_of_sample_to = "2026-05-31"
seeds = 200
direction_samples = 1000
fixed = true

[[hypothesis]]
label = "box/b2"
base = "volman-box"
filters = ["weekdays"]
overrides = { maxBoxAtr = 3.0, boxes = 1, emaPeriod = 18, atrPeriod = 14, maxBreakAtr = 1.0 }
why = "context: box 2 target on the last seventeen months of Vantage 5m bars"

[[hypothesis]]
label = "box/b3"
base = "volman-box"
filters = ["weekdays"]
overrides = { maxBoxAtr = 3.0, boxes = 2, emaPeriod = 18, atrPeriod = 14, maxBreakAtr = 1.0 }
why = "context: box 3 target on the same"
