[run]
in_sample = "xauusd:15m"
in_sample_from = "2025-09-13"
in_sample_to = "2026-09-12"
out_of_sample = "xauduka:15m"
out_of_sample_from = "2022-06-16"
out_of_sample_to = "2025-04-10"
seeds = 200
direction_samples = 1000

[[hypothesis]]
label = "ema-cross/all"
base = "ema-cross"
filters = ["weekdays", "flat:1630-1815"]
overrides = {}
why = "the moving-average cross baseline, all day"

[[hypothesis]]
label = "ema-cross/ny"
base = "ema-cross"
filters = ["weekdays", "flat:1630-1815", "hours:0800-1600"]
