# Quet co stop o loai stop THI HANH, ho L2 (target = rr x risk).
# Dang ky: docs/decisions/2026-10-09-enforced-stop.md muc 4.
# Nhan goc: pdhl/fade-allday cua docs/hypotheses/2026-09-13-pdhl.toml
# (dong n=50 trong receipts/gate-legs-table.txt).  CHI bufferPips doi.
[run]
in_sample = "xauduka:5m"
in_sample_to = "2025-04-10"
out_of_sample = "xauusd:5m"
seeds = 200
direction_samples = 1000
fixed = true

[[hypothesis]]
label = "pdhlbuf/b0001"
base = "pdhl"
filters = ["weekdays", "flat:1630-1815"]
overrides = { mode = 0, bufferPips = 1.0 }
why = "co stop 1 pip = 0.1 USD dem tren dinh nen cham; L2: target = risk x riskReward nen hinh hoc ti le"

