# Pre-registered batch for docs/decisions/2026-10-06-hold-ceiling.md.
# Written and committed BEFORE the first run.
#
# NINE ROWS, run three times over two windows: the ceiling is the only thing
# that changes between runs, and it changes in the config directory named by
# --config=, never here.
#
#   4 h   --config=config         ([trading] max_hold_ms, no override)  CONTROL
#   24 h  --config=config-h24     ([markets.xauusd.trading] 86_400_000)
#   120 h --config=config-h120    ([markets.xauusd.trading] 432_000_000)
#
# The nine rows are the three-month search's own registry cells, pinned:
# tsmom lookbackDays 20/60/120, volman-box boxBars 12/20/30, volume-thrust
# volMult 2.0/2.5/3.5 at the method's default riskReward 1.5. No filter is
# added, because the search of 2026-09-23 added none.

[run]
market = "xauusd"
interval = "15m"
window_a = { from = "2025-07-01", to = "2025-10-01" }
window_b = { from = "2025-04-01", to = "2025-07-01" }
seeds = 200
null_sides = "exposure"
fixed = true
guards = true
exit_mix = true

[[hypothesis]]
label = "tsmom-lb20"
base = "tsmom"
filters = []
overrides = { lookbackDays = 20 }
why = "the shortest lookback the method's own grid declares; does a lifted hold ceiling give a multi-day trend method any trades at all?"

[[hypothesis]]
label = "tsmom-lb60"
base = "tsmom"
filters = []
overrides = { lookbackDays = 60 }
why = "the method's default lookback, the three-month search's middle cell"

[[hypothesis]]
label = "tsmom-lb120"
base = "tsmom"
filters = []
overrides = { lookbackDays = 120 }
why = "the longest lookback the grid declares; the cell with the most warmup to pay for"

[[hypothesis]]
label = "vbox-bb12"
base = "volman-box"
filters = []
overrides = { boxBars = 12 }
why = "the shortest box the grid declares, so the most setups per window; the cell with the best chance of reaching a readable count"

[[hypothesis]]
label = "vbox-bb20"
base = "volman-box"
filters = []
overrides = { boxBars = 20 }
why = "the method's default box, the three-month search's middle cell"

[[hypothesis]]
label = "vbox-bb30"
base = "volman-box"
filters = []
overrides = { boxBars = 30 }
why = "the longest box the grid declares; a tight 30-bar box is the rarest setup and the one a 4-hour exit would truncate hardest"

[[hypothesis]]
label = "vthr-vm20"
base = "volume-thrust"
filters = []
overrides = { volMult = 2.0, riskReward = 1.5 }
why = "the loosest volume gate the grid declares, so the most setups; the cell most likely to clear 40 trades"

[[hypothesis]]
label = "vthr-vm25"
base = "volume-thrust"
filters = []
overrides = { volMult = 2.5, riskReward = 1.5 }
why = "the method's default volume multiple, the three-month search's middle cell"

[[hypothesis]]
label = "vthr-vm35"
base = "volume-thrust"
filters = []
overrides = { volMult = 3.5, riskReward = 1.5 }
why = "the strictest volume gate the grid declares; if a thrust needs room to run, this is the cell that most needs it"
