# Session variants of the recent-year screen, added at the owner's request:
# the same mechanisms, each gated to one session in New York time.
[run]
in_sample = "xauusd:15m"
in_sample_from = "2025-09-13"
in_sample_to = "2026-09-12"
out_of_sample = "xauduka:15m"
out_of_sample_from = "2022-06-16"
out_of_sample_to = "2025-04-10"
seeds = 200
direction_samples = 1000

[[hypothesis]]
label = "ema-cross/asia"
base = "ema-cross"
filters = ["weekdays", "flat:1630-1815", "hours:1800-0200"]
overrides = {}
why = "the moving-average cross baseline, the Asian session, 18:00-02:00 New York"

[[hypothesis]]
label = "ema-cross/london"
base = "ema-cross"
filters = ["weekdays", "flat:1630-1815", "hours:0300-1100"]
