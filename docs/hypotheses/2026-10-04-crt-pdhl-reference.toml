# DIAGNOSTIC D3 for docs/hypotheses/2026-10-04-crt.md, declared in that file's
# amendment of 2026-10-04 before it was run.
#
# TWO REFERENCE ROWS THAT CANNOT PRODUCE A CRT SURVIVOR. `pdhl` at mode 0 and
# at its own defaults, on the two CRT windows, so the deliverable's question -
# "is CRT as specified distinguishable from pdhl mode 0?" - is answered with a
# number beside the code read rather than only with the code read.
#
# `pdhl` is NOT a CRT cell and nothing here can rescue one. These are two more
# looks and are counted as such.

[run]
in_sample = { market = "xauduka", interval = "15m", from = "2018-06-16", to = "2022-06-16" }
out_of_sample = { market = "xauusd", interval = "15m", from = "2022-06-16", to = "2026-09-18" }
seeds = 300
null_sides = "exposure"
fixed = true

[[hypothesis]]
base = "pdhl"
label = "pdhl/mode0-bare"
filters = []
overrides = { mode = 0 }
why = "D3: the published method CRT is nearest to, on CRT's own two windows with CRT's own settings, so the two can be compared on trade count and on figures and not only on source"
