[package]
name = "fd-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP API and live stream over the store and the engines"

[dependencies]
fd-core = { workspace = true }
fd-indicators = { workspace = true }
fd-engine = { workspace = true }
fd-strategy = { workspace = true }
fd-backtest = { workspace = true }
fd-store = { workspace = true }
fd-ingest = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The research endpoint reads hypothesis batch files — and the authed
# listener reads its `[auth]` section out of config/local.toml.
toml = { workspace = true }
# The authed listener: PBKDF2, the constant-time compare, session tokens.
ring = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }

# `fd-api --set-password` turns the console's echo off while a password is
# typed. Windows only because that is the only console API available without
# a new dependency; everywhere else the command says it cannot and offers the
# two ways round it. windows-sys is already in the tree under tokio and ring,
# so this adds a direct dependency and no new crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }
