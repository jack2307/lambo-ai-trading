[package]
name = "fd-backtest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bar-driven backtest engine, parameter sweeps and walk-forward"

[dependencies]
fd-core = { workspace = true }
fd-indicators = { workspace = true }
fd-engine = { workspace = true }
# The search tool reads what the store holds; the library stays storage-free.
fd-store = { workspace = true }
fd-strategy = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# Hypothesis batches are declared in TOML so they can be written before a run.
toml = { workspace = true }
# The argv sidecar's digests. `ring` is already the tree's crypto (fd-api's
# auth), so this is the copy already in Cargo.lock rather than a second stack
# arriving behind it. SHA-256 only: see src/argv_sidecar.rs.
ring = { workspace = true }

[dev-dependencies]
fd-indicators = { workspace = true }
fd-engine = { workspace = true }
# The search tool reads what the store holds; the library stays storage-free.
fd-store = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "sweep"
harness = false
